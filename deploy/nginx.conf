# Nginx 站点配置模板
# 使用方法：宝塔面板 → 网站 → 对应站点 → 设置 → 配置文件，用此内容替换 server {} 块
# 如果没有域名，把 server_name 改成公网 IP 即可

server {
    listen 80;
    # 如果有域名，写域名；没有就写服务器公网 IP
    server_name _;

    # ===== 前端静态文件 =====
    # 宝塔面板里网站根目录一般是 /www/wwwroot/你的站点名
    # 把 dist/ 里的所有文件上传到这个目录
    root /www/wwwroot/jd-ai-workbench;
    index index.html index.htm;

    # Gzip 压缩，减少静态资源体积
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # SPA 路由 fallback：所有找不到的路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（Vite 构建的文件带 hash，可以长期缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== API 反向代理到后端 =====
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ===== SSE 流式响应关键配置 =====
        # 关闭 Nginx 缓冲，否则打字机效果会等全部生成完才显示
        proxy_buffering off;
        proxy_cache off;

        # SSE 长连接超时，设置长一点
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 如果以后配 HTTPS，可以把下面这段取消注释（宝塔会帮你自动生成）
    # listen 443 ssl http2;
    # ssl_certificate     /www/server/panel/vhost/cert/你的域名/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/你的域名/privkey.pem;
}
